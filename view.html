    .demon-counter-container {

      right: 20px;

      padding: 10px 12px 8px 12px;
      box-shadow: 0 0 20px #ff0000;
      animation: fadeIn 0.6s ease-out;
      pointer-events: none; 
    }

    .demon-counter-container .close-btn,
    .demon-counter-container .reload-btn {
      pointer-events: auto;
      position: absolute;
      background: transparent;
      border: none;
      color: #ff4444;
      font-size: 18px;
      cursor: pointer;
      text-shadow: 0 0 6px #ff0000;

    .close-btn:hover,

    }

    @keyframes spinReload {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes glowReload {
      0%, 100% { text-shadow: 0 0 8px #ff0000; }
      50% { text-shadow: 0 0 20px #ff5555; }

    .reload-anim {

      100% { box-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000 inset; }

    .pulse { animation: pulseGlow 2s infinite; }

    @keyframes fadeIn {
