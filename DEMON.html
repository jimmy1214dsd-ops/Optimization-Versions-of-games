  <script>
    document.addEventListener("keydown", function(event) {
      if (event.code === "Backquote") {
        window.location.href = "view.html";
      }
    });
    window.addEventListener("beforeunload", (e) => {
      e.preventDefault();
      e.returnValue = "";
    });
    const lessons = {
      intro: {
        title: "Intro to Web",
        desc: "What HTML, CSS, and JavaScript are and how they work together.",
        points: [
          "HTML defines the structure (headings, text, links).",
          "CSS controls appearance (colors, layout, spacing).",
          "JavaScript adds behavior (actions, response to events)."
        ],
        code: {
          html: "<!doctype html>\n<html>\n  <head>\n    <meta charset='utf-8'>\n    <title>Hello DEMON</title>\n  </head>\n  <body>\n    <h1 id='greet'>Hello, DEMON!</h1>\n    <button id='btn'>Click me</button>\n  </body>\n</html>",
          css: "body{font-family:Inter, sans-serif;padding:18px;background:#f7f7f7}\nh1{color:#ff2e2e}\nbutton{padding:8px 12px;border-radius:6px;border:none;background:#00e5ff}",
          js: "document.getElementById('btn').addEventListener('click', ()=> alert('Hello, DEMON!'))"
        }
      }
    };
    let current = 'intro';
    let currentTab = 'html';
    const editor = document.getElementById('codeEditor');
    const liveFrame = document.getElementById('liveFrame');
    const tabEls = Array.from(document.querySelectorAll('.tab'));
    function setTab(tab) {
      if(lessons[current].code) lessons[current].code[currentTab] = editor.value;
      currentTab = tab;
      editor.value = lessons[current].code[currentTab] || '';
      tabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    }
    function runPreview(){
      if(!lessons[current].code) lessons[current].code = {html:'',css:'',js:''};
      lessons[current].code[currentTab] = editor.value;
      const state = lessons[current].code;
      let html = state.html || "<!doctype html><html><body></body></html>";
      if(!/<!doctype html/i.test(html) && !/<html/i.test(html)) {
        html = `<!doctype html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`;
      }
      html = html.replace(/<\/head>/i, `<style>${state.css || ''}</style></head>`);
      html = html.replace(/<\/body>/i, `<script>${state.js || ''}<\/script></body>`);
      const blob = new Blob([html], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      liveFrame.src = url;
      setTimeout(()=>{ try{ URL.revokeObjectURL(url) }catch(e){} }, 30000);
    }
    tabEls.forEach(t=>{
      t.addEventListener('click', ()=>{
        if(lessons[current].code) lessons[current].code[currentTab] = editor.value;
        setTab(t.dataset.tab);
      });
    });
    document.getElementById('runBtn').addEventListener('click', runPreview);
    document.getElementById('loadExample').addEventListener('click', ()=>{
      const L = lessons[current];
      editor.value = L.code[currentTab] || L.code.html || '';
    });
    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      const code = lessons[current].code || {html:editor.value, css:'', js:''};
      const full = `${code.html}\n<style>${code.css}</style>\n<script>${code.js}<\/script>`;
      const blob = new Blob([full], {type:'text/html'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (current + '-sample.html');
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 30000);
    });
    document.getElementById('resourcesBtn').addEventListener('click', ()=>{
      const win = window.open('', '_blank', 'noopener');
      const html = `
        <html><head><title>DEMON — Resources</title></head>
        <body style="font-family:Inter,system-ui;margin:18px">
          <h2>Resources</h2>
          <ul>
            <li><a href="https://developer.mozilla.org/en-US/docs/Learn" target="_blank">MDN — Web Learning</a></li>
            <li><a href="https://www.freecodecamp.org" target="_blank">freeCodeCamp</a></li>
            <li><a href="https://www.theodinproject.com" target="_blank">The Odin Project</a></li>
            <li><a href="https://codepen.io" target="_blank">CodePen</a></li>
          </ul>
        </body></html>`;
      win.document.write(html); win.document.close();
    });
    document.getElementById('resetProgress').addEventListener('click', ()=>{
      editor.value = lessons['intro'].code.html;
      alert('Hub reset to Intro.');
    });
    editor.value = lessons[current].code.html;
    tabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ runPreview(); }
    });
    editor.addEventListener('blur', ()=>{
      if(lessons[current].code) lessons[current].code[currentTab] = editor.value;
    });
    setTimeout(()=> {
      const loader = document.getElementById('loading');
      if(loader) loader.remove();
      const iframe = document.createElement("iframe");
      iframe.className = "fullpage";
      iframe.src = "view.html";
      iframe.setAttribute("aria-hidden", "false");
      document.body.appendChild(iframe);
    }, 1000); 
    document.body.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
  </script>
